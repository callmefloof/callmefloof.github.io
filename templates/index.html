{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block content %}

<main>
    <section class="hero grid-8x8" aria-label="hero">
        <h1 class="hero-greeting">Hello,</h1>
        <img src="/images/who.png" alt="Who? It's me, Joëlle!" class="hero-profile-pic"/>
        <div class="hero-text">
            <h1>I am Joëlle Ubink</h1>
            <h2>“Learning, experimenting, and creating game worlds where systems and interactions feel meaningful.”</h2>
        </div>
    </section>
    <h1 id="projects" class="header_h1">Projects</h1>
    <br/>
    <section class="grid-8x8 rowsize-200 projects" aria-label="portfolio projects">
    {{- macros::display_cards() -}}
    </section>
</main>
{% endblock content %}
